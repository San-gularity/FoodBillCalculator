<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="description" content="Scan a receipt, add the people, tap who had what — everyone's share works out to the cent.">
  <title>Split the Bill</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash__mark" aria-hidden="true">🧾</div>
    <p>Loading your bill…</p>
  </div>

  <div id="app" class="app" hidden></div>

  <noscript>
    <div class="fatal">
      <h1>JavaScript required</h1>
      <p>This bill splitter runs entirely in your browser and needs JavaScript switched on.</p>
    </div>
  </noscript>

  <!-- Optional scanner config (Gemini key). Served from .env by npm start. -->
  <script src="config.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
